# PostgreSQL para desarrollo y pruebas en local.
# Arranque:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: reservas-db
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
      POSTGRES_DB: reservas
    ports:
      - '5432:5432'
    volumes:
      - reservas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reservas -d reservas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reservas-db-data:
